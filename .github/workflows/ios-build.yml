name: iOS build (experimental)

on:
  workflow_dispatch:

jobs:
  kotlin-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 1) Tim noi khai bao target iOS trong cac file gradle
      - name: Find iOS targets in Gradle files
        run: |
          grep -rnE "iosArm64|iosX64|iosSimulatorArm64|ios\(\)" \
            --include=*.gradle.kts --include=*.gradle --include=*.toml . \
            | grep -v "/build/" | tee ios-targets.txt || true
          find . -type d -name "iosMain" -not -path "*/build/*" | tee iosmain-dirs.txt || true

      # 2) Xem cau hinh cua cac module chinh va danh sach module
      - name: Dump key build files
        run: |
          cp composeApp/build.gradle.kts composeApp-build.gradle.kts.txt || true
          cp settings.gradle.kts settings.gradle.kts.txt || true
          ./gradlew -q projects > projects.txt 2>&1 || true

      # 3) Thu bien dich iOS o MOI module (khong gioi han :composeApp)
      - name: Compile iOS in all modules that support it
        run: ./gradlew compileKotlinIosArm64 --continue 2>&1 | tee build-ios.log
        continue-on-error: true

      - name: Try linking iOS frameworks in all modules
        run: ./gradlew linkDebugFrameworkIosArm64 --continue 2>&1 | tee build-ios-link.log
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: |
            ios-targets.txt
            iosmain-dirs.txt
            composeApp-build.gradle.kts.txt
            settings.gradle.kts.txt
            projects.txt
            build-ios.log
            build-ios-link.log
