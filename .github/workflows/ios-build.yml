name: iOS build (experimental)

on:
  workflow_dispatch:

jobs:
  kotlin-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Buoc 1: liet ke cac task iOS that su co trong repo
      - name: List iOS-related Gradle tasks
        run: ./gradlew tasks --all | grep -i ios | tee ios-tasks.txt || true

      # Buoc 2: thu bien dich framework iOS (--continue de thay het loi mot lan)
      # Neu ten task khac, sua lai theo ios-tasks.txt
      - name: Try linking iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --continue --stacktrace 2>&1 | tee build-ios.log
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: |
            ios-tasks.txt
            build-ios.log
            **/build/reports/**

