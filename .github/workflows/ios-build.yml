name: iOS build (experimental)

on:
  workflow_dispatch:

jobs:
  kotlin-ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # ---- Vá thử nghiệm ngay trong CI (không sửa repo gốc) ----
      # Thư mục core/ là git submodule nên vá bằng lệnh ở đây cho tiện.

      # Vá 1: ktorExt có cùng một 'actual' khai báo ở cả iosMain và iosArm64Main
      - name: Patch 1 - remove duplicate iosArm64Main in ktorExt
        run: |
          find core/service/ktorExt/src -type f | sort > ktorExt-files-before.txt
          rm -rf core/service/ktorExt/src/iosArm64Main

      # Vá 2: Dispatchers.IO không dùng được trong commonMain khi build cho iOS
      - name: Patch 2 - Dispatchers.IO -> Dispatchers.Default in domain
        run: |
          F=core/domain/src/commonMain/kotlin/com/maxrave/domain/utils/Resource.kt
          sed -i.bak 's/Dispatchers\.IO/Dispatchers.Default/g' "$F"
          grep -n "Dispatchers" "$F" > patch2-check.txt || true

      # Vá 3: bật target iOS (đang bị comment) trong composeApp
      - name: Patch 3 - enable iOS targets in composeApp
        run: |
          sed -i.bak '/^\/\/    listOf($/,/^\/\/    }$/ s#^//##' composeApp/build.gradle.kts
          sed -n '55,75p' composeApp/build.gradle.kts > patch3-check.txt
          find composeApp/src/iosMain -type f | sort > composeApp-iosMain-files.txt || true

      # ---- Build ----
      - name: Compile iOS in all modules
        run: ./gradlew compileKotlinIosArm64 --continue 2>&1 | tee build-ios.log
        continue-on-error: true

      - name: Link iOS framework of composeApp
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --continue 2>&1 | tee build-ios-link.log
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: |
            ktorExt-files-before.txt
            patch2-check.txt
            patch3-check.txt
            composeApp-iosMain-files.txt
            build-ios.log
            build-ios-link.log
